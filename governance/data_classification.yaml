# Data Classification Configuration
# Maps tables and columns to sensitivity levels and compliance requirements

data_classification:
  # Customer data - RESTRICTED sensitivity
  customer_tables:
    - table_name: "*.customers"
      sensitivity: "RESTRICTED"
      pii_types:
        - email
        - phone
        - address
        - date_of_birth
      retention_days: 2555  # 7 years
      encryption_required: true
      audit_logging_required: true
      compliance_frameworks:
        - GDPR
        - CCPA
    
    - table_name: "*.orders"
      sensitivity: "RESTRICTED"
      columns:
        - customer_id
        - address
      pii_types:
        - address
      retention_days: 2555  # 7 years
      encryption_required: true
      audit_logging_required: true
      compliance_frameworks:
        - GDPR
        - CCPA

  # Financial data - RESTRICTED sensitivity
  financial_tables:
    - table_name: "*payments"
      sensitivity: "RESTRICTED"
      pii_types:
        - credit_card
        - account_number
      retention_days: 2555  # 7 years
      encryption_required: true
      audit_logging_required: true
      compliance_frameworks:
        - SOX
        - HIPAA

  # Internal analytics - CONFIDENTIAL sensitivity
  internal_analytics:
    - table_name: "*_analytics"
      sensitivity: "CONFIDENTIAL"
      retention_days: 365
      encryption_required: true
      audit_logging_required: true
      compliance_frameworks:
        - Internal

  # Public data - PUBLIC sensitivity
  public_data:
    - table_name: "*reference*"
      sensitivity: "PUBLIC"
      retention_days: 0  # No limit
      encryption_required: false
      audit_logging_required: false
      compliance_frameworks: []

# Access control policies
access_control:
  # Role-based access control
  roles:
    admin:
      permissions:
        - read
        - write
        - delete
        - manage_permissions
        - audit
      can_access:
        - RESTRICTED
        - CONFIDENTIAL
        - INTERNAL
        - PUBLIC

    analyst:
      permissions:
        - read
        - write
      can_access:
        - CONFIDENTIAL
        - INTERNAL
        - PUBLIC
      cannot_access:
        - customer_pii
        - financial_data

    viewer:
      permissions:
        - read
      can_access:
        - INTERNAL
        - PUBLIC

    service_account:
      permissions:
        - read
        - write
      can_access:
        - CONFIDENTIAL
        - INTERNAL
      audit_all_access: true

# Data masking policies
data_masking:
  # Email masking
  email_mask_pattern: "^(.)[^@]*(@.*)$"
  email_mask_replacement: "$1***$2"

  # Phone masking
  phone_mask_pattern: "^(.{2})(.*)(.{2})$"
  phone_mask_replacement: "$1***$3"

  # SSN masking
  ssn_mask_pattern: "^(.{3})(.*?)(.{4})$"
  ssn_mask_replacement: "$1-**-$3"

  # Credit card masking
  card_mask_pattern: "^(.{4})(.*?)(.{4})$"
  card_mask_replacement: "$1-****-****-$3"

# Data governance policies
governance_policies:
  # Right to be forgotten (GDPR)
  right_to_be_forgotten:
    enabled: true
    max_days_to_comply: 30
    preserve_audit_trail: true

  # Data minimization
  data_minimization:
    enabled: true
    collect_only_necessary: true
    review_frequency_days: 90

  # Purpose limitation
  purpose_limitation:
    enabled: true
    purposes:
      - customer_analytics
      - business_operations
      - compliance_reporting

  # Consent management
  consent_management:
    enabled: true
    consent_types:
      - marketing
      - analytics
      - research
    require_explicit_consent: true

# Audit logging configuration
audit_logging:
  enabled: true
  
  # Events to log
  events_to_log:
    - data_access
    - data_modification
    - data_deletion
    - permission_changes
    - policy_changes
    - security_events
    - pipeline_runs
  
  # Retention of audit logs
  audit_log_retention_days: 2555  # 7 years
  
  # Real-time alerts
  alerts:
    - event_type: data_deletion
      severity: CRITICAL
      notify: security_team@company.com
    
    - event_type: security_event
      severity: CRITICAL
      notify: security_team@company.com
    
    - event_type: permission_change
      severity: HIGH
      notify: compliance_team@company.com

# Data quality SLAs
data_quality:
  slas:
    # Customer data completeness
    - sla_name: customer_completeness
      metric: completeness
      target_percentage: 99.5
      check_frequency_hours: 4
      breach_action: alert

    # Order data freshness
    - sla_name: order_freshness
      metric: freshness
      max_age_hours: 4
      target_percentage: 98.0
      check_frequency_hours: 2
      breach_action: alert

    # Test passage rate
    - sla_name: test_passage
      metric: test_pass_rate
      threshold: 95.0
      check_frequency_hours: 24
      breach_action: block_deployment

# Encryption policies
encryption:
  # At-rest encryption
  at_rest:
    enabled: true
    algorithm: "AES-256"
    key_management: "Azure Key Vault"

  # In-transit encryption
  in_transit:
    enabled: true
    protocol: "TLS 1.3"
    certificate_validation: true

  # Data classification encryption requirements
  requirements:
    RESTRICTED:
      at_rest: true
      in_transit: true
    CONFIDENTIAL:
      at_rest: true
      in_transit: true
    INTERNAL:
      at_rest: false
      in_transit: true
    PUBLIC:
      at_rest: false
      in_transit: false
