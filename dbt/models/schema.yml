version: 2

sources:
  - name: raw
    description: Raw data layer from source systems
    database: hive_metastore
    schema: "{{ var('data_schema') }}"
    tables:
      - name: customers
        description: Raw customer data
        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name
            tests:
              - not_null
          - name: last_name
            description: Customer last name
          - name: email
            description: Customer email address
            tests:
              - unique

      - name: orders
        description: Raw order transactions
        columns:
          - name: order_id
            description: Unique order identifier
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Reference to customer
            tests:
              - not_null
              - relationships:
                  to: source('raw', 'customers')
                  field: customer_id
          - name: order_date
            description: Date order was placed
            tests:
              - not_null
          - name: total_amount
            description: Total order amount
            tests:
              - accepted_values:
                  values: [0]
                  quote: false

models:
  - name: stg_customers
    description: Staging layer for customer data
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: Staging layer for order data
    columns:
      - name: order_id
        description: Unique order identifier
        tests:
          - unique
          - not_null

  - name: dim_customers
    description: Customer dimension table
    columns:
      - name: customer_id
        description: Unique customer identifier
        tests:
          - unique
          - not_null

  - name: fct_customer_orders
    description: Customer orders fact table
    columns:
      - name: customer_order_key
        description: Surrogate key for customer orders
        tests:
          - unique
          - not_null
