
# Name your project! Project names should be lowercase and use underscores as spaces.
name: 'databricks_dbt_project'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'databricks_dev'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:
  databricks_dbt_project:
    materialized: table
    staging:
      +materialized: view
      +tags: ['staging']
    intermediate:
      +materialized: view
      +tags: ['intermediate']
    marts:
      +materialized: table
      +tags: ['marts']
      +schema: 'marts'

# Seed configurations
seeds:
  databricks_dbt_project:
    +tags: ['seeds']

# Global variables
vars:
  # Environment-specific variables - override in profiles.yml
  environment: 'dev'
  catalog: 'hive_metastore'
  data_schema: 'raw'
  staging_schema: 'staging'
  marts_schema: 'marts'

# Tests
on-run-start:
  - "{{ log('Starting dbt run for environment: ' ~ env_var('DBT_ENV', 'dev'), info=true) }}"

on-run-end:
  - "{{ log('dbt run completed successfully', info=true) }}"
