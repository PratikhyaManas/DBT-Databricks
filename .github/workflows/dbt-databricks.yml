name: dbt-Databricks CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.9'
  DBT_PROFILES_DIR: './dbt'

jobs:
  # ========================================
  # CI JOBS - Run on all branches & PRs
  # ========================================

  health-check:
    name: Infrastructure Health Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Databricks SDK
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sdk -q

      - name: Test Databricks Connection
        run: |
          python - <<'EOF'
          import sys
          from databricks.sdk import WorkspaceClient
          
          try:
              ws = WorkspaceClient(
                  host='${{ secrets.DATABRICKS_HOST }}',
                  token='${{ secrets.DATABRICKS_TOKEN }}'
              )
              user = ws.current_user.me()
              print(f"✅ Databricks connection successful. User: {user.user_name}")
          except Exception as e:
              print(f"❌ Databricks connection failed: {e}")
              sys.exit(1)
          EOF

      - name: Validate Warehouse Availability
        run: |
          python - <<'EOF'
          import sys
          from databricks.sdk import WorkspaceClient
          
          try:
              ws = WorkspaceClient(
                  host='${{ secrets.DATABRICKS_HOST }}',
                  token='${{ secrets.DATABRICKS_TOKEN }}'
              )
              warehouses = ws.warehouses.list()
              warehouse_count = sum(1 for _ in warehouses)
              if warehouse_count > 0:
                  print(f"✅ Found {warehouse_count} warehouse(s)")
              else:
                  print("⚠️  No warehouses found")
                  sys.exit(1)
          except Exception as e:
              print(f"❌ Warehouse validation failed: {e}")
              sys.exit(1)
          EOF

  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    needs: health-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks databricks-sdk pyyaml

  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dbt
        run: pip install dbt-databricks -q

      - name: Validate dbt Configuration
        run: |
          cd dbt
          dbt debug --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Parse dbt Project
        run: |
          cd dbt
          dbt parse --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dbt
        run: pip install dbt-databricks -q

      - name: Install dbt Dependencies
        run: |
          cd dbt
          dbt deps --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Run Modified Models (Slim CI)
        continue-on-error: true
        run: |
          cd dbt
          dbt run --profiles-dir ${{ env.DBT_PROFILES_DIR }} --select state:modified+ --state ./target
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBT_ENV: dev

      - name: Run Data Quality Tests
        run: |
          cd dbt
          dbt test --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBT_ENV: dev

  security:
    name: Security Scanning (SAST)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Security Tools
        run: |
          pip install bandit semgrep detect-secrets pip-audit -q

      - name: Python Security Scan (Bandit)
        run: |
          bandit -r scripts/ -f json -o bandit-report.json
        continue-on-error: true

      - name: SQL Security Scan (Semgrep)
        run: |
          semgrep --config p/databricks dbt/models/ -o semgrep-report.json --json 2>&1 | head -100
        continue-on-error: true

      - name: Secrets Detection
        run: |
          detect-secrets scan --baseline .secrets.baseline
        continue-on-error: true

      - name: Dependency Vulnerability Scan
        run: |
          pip-audit --desc > pip-audit.txt
        continue-on-error: true

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            pip-audit.txt

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install sqlfluff
        run: pip install sqlfluff -q

      - name: Run SQL Linting
        run: |
          sqlfluff vet --dialect databricks dbt/models/

  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dbt
        run: pip install dbt-databricks -q

      - name: Generate dbt Docs
        run: |
          cd dbt
          dbt docs generate --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBT_ENV: dev

      - name: Upload dbt Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dbt-artifacts
          path: dbt/target

  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [health-check, setup, validate, test, security, lint, documentation]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [[ "${{ needs.health-check.result }}" != "success" || 
                "${{ needs.setup.result }}" != "success" || 
                "${{ needs.validate.result }}" != "success" || 
                "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ CI Pipeline failed"
            exit 1
          fi
          echo "✅ CI Pipeline completed"

  # ========================================
  # CD JOBS - Run only on main branch push
  # ========================================

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci-status
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks databricks-sdk pyyaml

      - name: Install dbt Dependencies
        run: |
          cd dbt
          dbt deps --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}

      - name: Run dbt Models (Staging)
        run: |
          cd dbt
          dbt run --profiles-dir ${{ env.DBT_PROFILES_DIR }} --target staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
          DBT_ENV: staging

      - name: Run Data Quality Tests (Staging)
        run: |
          cd dbt
          dbt test --profiles-dir ${{ env.DBT_PROFILES_DIR }} --target staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}
          DBT_ENV: staging

      - name: Deploy Databricks Asset Bundle (Staging)
        run: |
          pip install databricks-labs-blueprint
          databricks bundle deploy --target staging -C databricks_bundles/staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}

      - name: Notify Staging Deployment Success
        if: success()
        run: |
          echo "✅ Staging deployment successful"
          echo "Staging environment: ${{ secrets.DATABRICKS_WORKSPACE_URL }}"

  approve-production:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production-approval
    steps:
      - name: Production Approval
        run: |
          echo "✅ Production deployment approved"
          echo "Proceed to deploy to production"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approve-production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ secrets.DATABRICKS_WORKSPACE_URL_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks databricks-sdk pyyaml

      - name: Install dbt Dependencies
        run: |
          cd dbt
          dbt deps --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}

      - name: Run dbt Models in Production
        run: |
          cd dbt
          dbt run --profiles-dir ${{ env.DBT_PROFILES_DIR }} --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          DBT_ENV: prod

      - name: Run Production Data Quality Tests
        run: |
          cd dbt
          dbt test --profiles-dir ${{ env.DBT_PROFILES_DIR }} --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          DBT_ENV: prod

      - name: Deploy Production Databricks Asset Bundle
        run: |
          pip install databricks-labs-blueprint
          databricks bundle deploy --target prod -C databricks_bundles/prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}

      - name: Deployment Complete
        run: |
          echo "✅ Production deployment successful"
          echo "Production environment: ${{ secrets.DATABRICKS_WORKSPACE_URL_PROD }}"
