name: dbt-Databricks CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feature/**
    paths:
      - 'dbt/**'
      - 'scripts/**'
      - 'pipelines/**'
      - 'databricks.yml'
      - 'databricks_bundles/**'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/dbt-databricks.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'dbt/**'
      - 'scripts/**'
      - 'pipelines/**'
      - 'databricks.yml'
      - 'databricks_bundles/**'
      - 'requirements.txt'
      - 'Makefile'
      - '.github/workflows/dbt-databricks.yml'

env:
  PYTHON_VERSION: '3.9'
  DBT_PROFILES_DIR: './dbt'

jobs:
  ci:
    name: dbt CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('dbt/packages.yml') }}
          restore-keys: |
            dbt-packages-${{ runner.os }}-

      - name: Install dbt Packages
        run: |
          cd dbt
          dbt deps --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Step 1 - Lint SQL (sqlfluff)
        run: |
          sqlfluff lint --dialect databricks dbt/models/

      - name: Step 2 - dbt compile (syntax check)
        run: |
          cd dbt
          dbt compile --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBT_ENV: dev

      - name: Save dbt state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-state
          path: dbt/target

      - name: Step 3 - dbt run modified only (Slim CI)
        run: |
          cd dbt
          dbt run --profiles-dir ${{ env.DBT_PROFILES_DIR }} --select state:modified+
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBT_ENV: dev

      - name: Step 4 - dbt test modified only
        run: |
          cd dbt
          dbt test --profiles-dir ${{ env.DBT_PROFILES_DIR }} --select state:modified+
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBT_ENV: dev

      - name: Step 5 - dbt source freshness
        run: |
          cd dbt
          dbt source freshness --profiles-dir ${{ env.DBT_PROFILES_DIR }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBT_ENV: dev

      - name: Upload dbt Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts
          path: |
            dbt/target
            logs

  deploy-production:
    name: Production Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ secrets.DATABRICKS_WORKSPACE_URL_PROD }}

    steps:
      - uses: actions/checkout@v4

      - name: Download dbt state artifact
        uses: actions/download-artifact@v4
        with:
          name: dbt-state
          path: dbt/state

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Production - dbt run
        run: |
          cd dbt
          if [ -f state/manifest.json ]; then
            dbt run --profiles-dir ${{ env.DBT_PROFILES_DIR }} --target prod --select state:modified+ --state state
          else
            echo "No prior manifest found; running full model set"
            dbt run --profiles-dir ${{ env.DBT_PROFILES_DIR }} --target prod
          fi
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          DBT_ENV: prod

      - name: Production - dbt test
        run: |
          cd dbt
          dbt test --profiles-dir ${{ env.DBT_PROFILES_DIR }} --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          DBT_ENV: prod

      - name: Production - dbt source freshness
        run: |
          cd dbt
          dbt source freshness --profiles-dir ${{ env.DBT_PROFILES_DIR }} --target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
          DBT_ENV: prod

      - name: Deploy Production Databricks Asset Bundle
        run: |
          databricks bundle deploy --target prod -C databricks_bundles/prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}

  notify-failure:
    name: Slack Alert on Failure
    runs-on: ubuntu-latest
    needs: [ci, deploy-production]
    if: always() && (needs.ci.result == 'failure' || needs.deploy-production.result == 'failure')

    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "dbt pipeline failed in ${{ github.repository }} on ${{ github.ref_name }}. Workflow: ${{ github.workflow }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
